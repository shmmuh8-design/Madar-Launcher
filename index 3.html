<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدار">
<meta name="theme-color" content="#04061a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>مدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1f45; --ink-2:#2b3266; --muted:rgba(26,31,69,.62);
  --sky-top:#b9c6ff; --sky-bottom:#efe2ff; --neb-a:rgba(255,170,90,.3); --neb-b:rgba(120,110,255,.3);
  --glass:rgba(255,255,255,.55); --glass-line:rgba(255,255,255,.85); --panel:rgba(255,255,255,.38);
  --tab-a:rgba(255,255,255,.9); --tab-b:rgba(255,255,255,.45);
  --saffron:#e8902a; --star:70,70,140; --label-shadow:rgba(255,255,255,.7);
  --floor-a:rgba(110,210,70,.45); --floor-b:rgba(110,80,255,.3);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f3efe6; --ink-2:#d9d4ff; --muted:rgba(243,239,230,.58);
    --sky-top:#03041a; --sky-bottom:#0d0a2c; --neb-a:rgba(255,150,60,.12); --neb-b:rgba(80,70,255,.32);
    --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.15); --panel:rgba(20,22,60,.42);
    --tab-a:rgba(255,255,255,.2); --tab-b:rgba(255,255,255,.04);
    --saffron:#ffb547; --star:255,244,225; --label-shadow:rgba(0,0,0,.75);
    --floor-a:rgba(120,230,60,.5); --floor-b:rgba(90,60,255,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#f3efe6; --ink-2:#d9d4ff; --muted:rgba(243,239,230,.58);
  --sky-top:#03041a; --sky-bottom:#0d0a2c; --neb-a:rgba(255,150,60,.12); --neb-b:rgba(80,70,255,.32);
  --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.15); --panel:rgba(20,22,60,.42);
  --tab-a:rgba(255,255,255,.2); --tab-b:rgba(255,255,255,.04);
  --saffron:#ffb547; --star:255,244,225; --label-shadow:rgba(0,0,0,.75);
  --floor-a:rgba(120,230,60,.5); --floor-b:rgba(90,60,255,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:var(--sky-top);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;overflow:hidden;color:var(--ink);
  font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(70% 40% at 75% 10%,var(--neb-b),transparent 70%),
    radial-gradient(50% 35% at 15% 80%,var(--neb-a),transparent 70%),
    linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
  display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- 3D stage ---------- */
#stage{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden;perspective:1000px;perspective-origin:50% 45%;touch-action:none}
#floor{position:absolute;left:50%;bottom:-18%;width:170%;height:60%;transform:translateX(-50%);pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 40%,var(--floor-a),var(--floor-b) 38%,transparent 68%);filter:blur(8px)}
#ring{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.panel{
  position:absolute;inset:8px 8px 6px;border-radius:26px;padding:12px 12px 10px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--glass-line);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
body.ov .panel{-webkit-box-reflect:below 12px linear-gradient(transparent 58%,rgba(255,255,255,.28));cursor:pointer}
body.ov .panel .app,body.ov .panel input{pointer-events:none}
.ptab{
  flex:none;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px;font-weight:600;font-size:16px;
  background:linear-gradient(180deg,var(--tab-a),var(--tab-b));border:1px solid var(--glass-line);
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.ptab .em{font-size:20px}
.ptab .cnt{margin-inline-start:auto;font-size:12px;font-weight:500;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 2px;margin-top:18px;align-content:start}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0}
.ic{
  width:58px;height:58px;border-radius:17px;display:grid;place-items:center;font-size:29px;
  background:linear-gradient(145deg,var(--c1),var(--c2));position:relative;overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .16s ease;
}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.36),transparent 48%);pointer-events:none}
.lb{font-size:11.5px;font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 5px var(--label-shadow)}
.app.press .ic{transform:scale(.86)}

/* home panel */
.clockw{text-align:center;margin:14px 0 4px}
#clock{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-weight:700;font-size:clamp(50px,16vw,80px);line-height:1}
#clock small{font-size:.3em;font-weight:500;color:var(--saffron);margin-inline-start:6px}
.dates{margin-top:6px;font-size:14px;color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.dates b{font-weight:500;color:var(--ink-2)}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:14px;margin-top:16px;
  background:var(--glass);border:1px solid var(--glass-line)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;outline:none}
.search input::placeholder{color:var(--muted)}
.sect{margin:16px 4px 0;font-size:12.5px;color:var(--muted)}
.home .pgrid{margin-top:12px}

/* ---------- SPB bar ---------- */
.bar{position:relative;z-index:2;padding:4px 14px 6px}
#dots{display:flex;justify-content:center;align-items:center;gap:8px;height:18px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.3;border:0;padding:0;cursor:pointer;transition:all .3s}
.dot.home{width:auto;height:auto;background:none;font-size:11px;opacity:.45;color:var(--ink)}
.dot.on{opacity:1;background:var(--saffron);width:20px;border-radius:4px}
.dot.home.on{background:none;width:auto;color:var(--saffron)}
.btns{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.iconbtn{width:46px;height:42px;flex:none;border-radius:14px;font-size:18px;cursor:pointer;color:var(--ink);
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.iconbtn[aria-pressed="true"]{background:var(--saffron);border-color:transparent}
.pill{height:42px;padding:0 22px;border-radius:999px;border:1px solid var(--glass-line);background:linear-gradient(180deg,var(--tab-a),var(--tab-b));
  color:var(--ink);font:inherit;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.pill[aria-pressed="true"]{background:var(--saffron);color:#1b1206;border-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

/* ---------- dock (6 folders) ---------- */
.dock{position:relative;z-index:2;margin:2px 10px 10px;padding:10px 6px 8px;border-radius:28px;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.fold{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0;color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.fic{width:min(50px,12.8vw);aspect-ratio:1;border-radius:15px;padding:5px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;
  background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s,box-shadow .3s}
.fic span{display:grid;place-items:center;font-size:min(14px,3.4vw);background:rgba(255,255,255,.2);border-radius:5px;line-height:1}
.fold:active .fic{transform:scale(.9)}
.fold.cur .fic{box-shadow:0 0 0 2.5px var(--saffron),0 0 22px var(--saffron)}
.fold .lb{font-size:10.5px}

#fx{position:fixed;z-index:50;display:none;place-items:center;border-radius:18px;font-size:30px;pointer-events:none;
  transition:left .42s cubic-bezier(.2,.8,.2,1),top .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1),height .42s cubic-bezier(.2,.8,.2,1),border-radius .42s,font-size .42s}
#fx.go{left:0!important;top:0!important;width:100vw!important;height:100vh!important;border-radius:0;font-size:120px}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:rgba(20,16,40,.9);color:#fff6e6;padding:10px 16px;border-radius:14px;font-size:13.5px;max-width:88vw;text-align:center;
  opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(5,4,20,.5);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}
.sheet-card{width:100%;max-height:88%;overflow:auto;background:var(--sky-bottom);color:var(--ink);
  border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{margin:0;font-family:"Reem Kufi",sans-serif;font-size:22px}
.sheet h4{margin:18px 2px 8px;font-size:14px;color:var(--muted);font-weight:500}
.ftabs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ftabs button{height:48px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass);font-size:22px;cursor:pointer}
.ftabs button[aria-pressed="true"]{background:var(--saffron);border-color:transparent}
.form{display:grid;grid-template-columns:1fr 70px;gap:8px}
.form input{height:44px;border-radius:12px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font:inherit;font-size:15px;padding:0 12px;min-width:0}
.form .wide{grid-column:1/-1}
.form input[type=color]{padding:4px}
.emo{text-align:center;font-size:22px!important}
.primary{grid-column:1/-1;height:46px;border:0;border-radius:12px;background:var(--saffron);color:#1b1206;font:inherit;font-weight:600;font-size:15px;cursor:pointer}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:8px 2px 0}
.hint code{direction:ltr;unicode-bidi:embed}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--glass)}
.item .ic{width:38px;height:38px;border-radius:11px;font-size:20px;box-shadow:none}
.item span.n{flex:1;font-size:14.5px}
.item button{width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--ink);font-size:17px;cursor:pointer}
.item button.on{background:var(--saffron);color:#1b1206}
.ghost{margin-top:14px;width:100%;height:42px;border-radius:12px;border:1px solid var(--glass-line);background:transparent;color:var(--muted);font:inherit;cursor:pointer}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.pick button span{font-size:26px}
.pick button.on{background:var(--saffron);color:#1b1206;border-color:transparent}

/* widgets */
.mini{display:flex;align-items:center;gap:8px;margin:12px auto 0;padding:8px 14px;border-radius:999px;font-size:12.5px;max-width:100%;
  background:var(--glass);border:1px solid var(--glass-line);cursor:pointer;white-space:nowrap;overflow:hidden}
.mini span{overflow:hidden;text-overflow:ellipsis}.mini .sep{width:1px;height:14px;background:var(--glass-line);flex:none}
.mini .go{color:var(--saffron);font-weight:700;flex:none}
.loc{margin-inline-start:auto;border:0;background:var(--glass);color:var(--ink);font:inherit;font-size:12.5px;padding:6px 10px;border-radius:10px;cursor:pointer}
.wcard{margin-top:12px;padding:14px;border-radius:20px;background:linear-gradient(160deg,var(--tab-a),var(--tab-b));border:1px solid var(--glass-line);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.wnow{display:flex;align-items:center;gap:12px}
.wemo{font-size:50px;line-height:1}
.wtemp{font-family:"Reem Kufi",sans-serif;font-weight:700;font-size:46px;line-height:1}
.wdesc{font-size:13px;color:var(--ink-2);margin-top:4px}
.wmeta{margin-inline-start:auto;font-size:12px;color:var(--muted);line-height:1.7;text-align:left;white-space:nowrap}
.whours{display:grid;grid-template-columns:repeat(6,1fr);margin-top:12px;text-align:center;gap:2px}
.whours div{display:flex;flex-direction:column;gap:3px;align-items:center}
.whours small{font-size:11px;color:var(--muted)}.whours span{font-size:20px}.whours b{font-size:13px;font-weight:600}
.phead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.phead span{font-size:12.5px;color:var(--saffron);font-weight:600}
.ptimes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pt{padding:9px 4px;border-radius:13px;background:var(--glass);text-align:center}
.pt small{display:block;font-size:11.5px;color:var(--muted)}.pt b{font-size:15px;font-weight:600}
.pt.next{background:var(--saffron);color:#1b1206}.pt.next small{color:rgba(27,18,6,.75)}
@media (prefers-reduced-motion: reduce){.sheet-card{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>

<main id="stage" aria-label="الشاشات">
  <div id="floor"></div>
  <div id="ring"></div>
</main>

<div class="bar">
  <div id="dots" aria-label="الشاشات"></div>
  <div class="btns">
    <button class="iconbtn" id="editBtn" aria-label="تخصيص">✏️</button>
    <button class="pill" id="ovBtn" aria-pressed="false">◎ كل الشاشات</button>
    <button class="iconbtn" id="gyroBtn" aria-pressed="false" aria-label="تحكم بإمالة الهاتف">🧭</button>
  </div>
</div>

<nav class="dock" id="dock" aria-label="المجلدات"></nav>

<div id="fx"></div>
<div id="toast" role="status"></div>

<div class="sheet" id="picker" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2 id="pTitle"></h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <div class="pick" id="pList"></div>
  </div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><h2>تخصيص مدار</h2><button class="iconbtn" data-close aria-label="إغلاق">✕</button></div>
    <h4>المجلدات (كل مجلد = شاشة)</h4>
    <div class="ftabs" id="fTabs"></div>
    <div class="form" style="margin-top:8px">
      <input id="fdName" placeholder="اسم المجلد">
      <input id="fdEmoji" class="emo" maxlength="4">
    </div>
    <h4>أضف تطبيقاً لهذا المجلد</h4>
    <div class="form">
      <input id="fName" placeholder="اسم التطبيق">
      <input id="fEmoji" class="emo" placeholder="🙂" maxlength="4">
      <input id="fUrl" class="wide" placeholder="الرابط: whatsapp:// أو https://…" dir="ltr">
      <input id="fColor" type="color" value="#7b6cff" class="wide" aria-label="لون الأيقونة">
      <button class="primary" id="addBtn">أضف التطبيق</button>
    </div>
    <p class="hint">أمثلة: <code>tel:+968…</code> ، <code>https://wa.me/968…</code> ، <code>shortcuts://run-shortcut?name=كاميرا</code></p>
    <h4>كل التطبيقات — ✓ يعني موجود في المجلد المختار</h4>
    <div class="list" id="list"></div>
    <button class="ghost" id="resetBtn">استعادة الإعدادات الافتراضية</button>
  </div>
</div>

/* ---------- prayer times (Fajr 18°, Isha 18°, Asr Shafi'i) ---------- */
const PR=[['fajr','الفجر'],['sunrise','الشروق'],['dhuhr','الظهر'],['asr','العصر'],['maghrib','المغرب'],['isha','العشاء']];
function prayerTimes(date,lat,lng){
  const d2r=Math.PI/180,dsin=x=>Math.sin(x*d2r),dcos=x=>Math.cos(x*d2r),dtan=x=>Math.tan(x*d2r);
  const dasin=x=>Math.asin(x)/d2r,dacos=x=>Math.acos(x)/d2r,datan2=(y,x)=>Math.atan2(y,x)/d2r,dacot=x=>Math.atan(1/x)/d2r;
  const fixA=a=>{a=a-360*Math.floor(a/360);return a<0?a+360:a},fixH=h=>{h=h-24*Math.floor(h/24);return h<0?h+24:h};
  let y=date.getFullYear(),m=date.getMonth()+1;const d=date.getDate();
  if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  const jDate=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5-lng/(15*24);
  const sun=jd=>{const D=jd-2451545,g=fixA(357.529+.98560028*D),q=fixA(280.459+.98564736*D),L=fixA(q+1.915*dsin(g)+.02*dsin(2*g)),e=23.439-.00000036*D;
    const RA=datan2(dcos(e)*dsin(L),dcos(L))/15;return{decl:dasin(dsin(e)*dsin(L)),eqt:q/15-fixH(RA)}};
  const mid=t=>fixH(12-sun(jDate+t).eqt);
  const ang=(a,t,ccw)=>{const decl=sun(jDate+t).decl,noon=mid(t);
    const v=1/15*dacos(clamp((-dsin(a)-dsin(decl)*dsin(lat))/(dcos(decl)*dcos(lat)),-1,1));return noon+(ccw?-v:v)};
  const asr=t=>{const decl=sun(jDate+t).decl;return ang(-dacot(1+dtan(Math.abs(lat-decl))),t)};
  const tz=-date.getTimezoneOffset()/60,adj=tz-lng/15;
  const h={fajr:ang(18,5/24,true),sunrise:ang(.833,6/24,true),dhuhr:mid(12/24),asr:asr(13/24),maghrib:ang(.833,18/24),isha:ang(18,18/24)};
  const out={};
  for(const k in h){const v=h[k]+adj,dt=new Date(date.getFullYear(),date.getMonth(),date.getDate(),0,0,0);dt.setMinutes(Math.round(v*60));out[k]=dt}
  return out;
}
const fmtT=d=>{try{return d.toLocaleTimeString('ar-OM-u-nu-latn',{hour:'numeric',minute:'2-digit'})}catch(e){return d.toTimeString().slice(0,5)}};
function nextPrayer(){
  const now=new Date();let t=prayerTimes(now,loc.lat,loc.lng);
  for(const [k,n] of PR){if(k!=='sunrise'&&t[k]>now)return{k,n,at:t[k],today:t}}
  const tm=new Date(now.getTime()+864e5),t2=prayerTimes(tm,loc.lat,loc.lng);
  return{k:'fajr',n:'الفجر',at:t2.fajr,today:t};
}
const left=ms=>{const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60),mm=m%60;return h?h+' س '+mm+' د':mm+' دقيقة'};
function renderPrayer(){
  const P=$('#pTimes');if(!P)return;
  const np=nextPrayer(),now=new Date();
  P.innerHTML=PR.map(([k,n])=>'<div class="pt'+(k===np.k&&np.at.toDateString()===now.toDateString()?' next':'')+'"><small>'+n+'</small><b>'+esc(fmtT(np.today[k]))+'</b></div>').join('');
  $('#pNext').textContent=np.n+' بعد '+left(np.at-now);

const WMO={0:['☀️','صحو'],1:['🌤️','صحو غالباً'],2:['⛅','غائم جزئياً'],3:['☁️','غائم'],45:['🌫️','ضباب'],48:['🌫️','ضباب'],
  51:['🌦️','رذاذ خفيف'],53:['🌦️','رذاذ'],55:['🌧️','رذاذ كثيف'],61:['🌦️','مطر خفيف'],63:['🌧️','مطر'],65:['🌧️','مطر غزير'],
  66:['🌧️','مطر متجمد'],67:['🌧️','مطر متجمد'],71:['🌨️','ثلج خفيف'],73:['🌨️','ثلج'],75:['❄️','ثلج كثيف'],77:['🌨️','حبيبات ثلج'],
  80:['🌦️','زخات خفيفة'],81:['🌧️','زخات'],82:['⛈️','زخات قوية'],85:['🌨️','زخات ثلج'],86:['🌨️','زخات ثلج'],95:['⛈️','عواصف رعدية'],96:['⛈️','عواصف وبَرَد'],99:['⛈️','عواصف وبَرَد']};
let wx=store.get('madar3-wx',null),wxErr=false;
function wmo(c,day){const w=WMO[c]||['🌡️','—'];if(day===0&&(c===0||c===1))return[c===0?'🌙':'🌙',w[1]];return w}
async function loadWeather(force){
  if(!force&&wx&&wx.lat===loc.lat&&wx.lng===loc.lng&&Date.now()-wx.at<30*60*1000){renderWeather();return}
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+loc.lat+'&longitude='+loc.lng+
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day'+
      '&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2';
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const d=await r.json();wx={at:Date.now(),lat:loc.lat,lng:loc.lng,d};wxErr=false;store.set('madar3-wx',wx);
  }catch(e){wxErr=true}
  renderWeather();
}
function renderWeather(){
  const E=$('#wTemp');if(!E)return;
  if(!wx||wx.lat!==loc.lat||wx.lng!==loc.lng){
    $('#wEmo').textContent='🌡️';E.textContent='--°';

    $('#wMeta').textContent='';$('#wHours').innerHTML='';$('#miniW').textContent='🌡️ —';return}
  const d=wx.d,c=d.current,[em,ds]=wmo(c.weather_code,c.is_day);
  $('#wEmo').textContent=em;E.textContent=Math.round(c.temperature_2m)+'°';
  $('#wDesc').textContent=ds+' · يُحس '+Math.round(c.apparent_temperature)+'°';
  $('#wMeta').innerHTML='↑ '+Math.round(d.daily.temperature_2m_max[0])+'°  ↓ '+Math.round(d.daily.temperature_2m_min[0])+'°<br>💧 '+c.relative_humidity_2m+'%<br>💨 '+Math.round(c.wind_speed_10m)+' كم/س';
  const key=c.time.slice(0,13);let i=d.hourly.time.findIndex(t=>t.slice(0,13)>key);if(i<0)i=0;
  let h='';for(let k=i;k<i+6&&k<d.hourly.time.length;k++){const hr=+d.hourly.time[k].slice(11,13);
    h+='<div><small>'+((hr%12)||12)+(hr<12?' ص':' م')+'</small><span>'+wmo(d.hourly.weather_code[k],d.hourly.is_day[k])[0]+'</span><b>'+Math.round(d.hourly.temperature_2m[k])+'°</b></div>'}
  $('#wHours').innerHTML=h;
  $('#miniW').textContent=em+' '+Math.round(c.temperature_2m)+'° '+loc.name;
}

/* ---------- pointer ---------- */
let downAct=null,sx,sy,lx,ly,lt,axis=null,downApp=null,downPanel=null,longTimer=null,startAngle=0,lastDx=0;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('input'))return;
  dragging=true;axis=null;sx=lx=e.clientX;sy=ly=e.clientY;startAngle=angle;lastDx=0;
  downApp=overview?null:e.target.closest('.app');downPanel=e.target.closest('.panel');downAct=overview?null:e.target.closest('[data-act]');
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(downApp){downApp.classList.add('press');
    longTimer=setTimeout(()=>{const a=appById(downApp.dataset.id);downApp.classList.remove('press');dragging=false;downApp=null;if(a)openPicker(a)},560)}
});
stage.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lx;lx=e.clientX;ly=e.clientY;
  const tx=e.clientX-sx,ty=e.clientY-sy;
  if(!axis&&Math.hypot(tx,ty)>9){axis=Math.abs(tx)>=Math.abs(ty)?'h':'v';clearTimeout(longTimer);if(downApp)downApp.classList.remove('press')}
  if(axis==='h'){angle+=overview?dx*.32:dx/W*step*1.05;lastDx=dx;angleT=angle}
});
function endPointer(e){
  clearTimeout(longTimer);
  if(!dragging){downApp=null;return}
  dragging=false;if(downApp)downApp.classList.remove('press');
  const ty=e.clientY-sy;
  if(!axis&&e.type==='pointerup'){
    if(downApp){const a=appById(downApp.dataset.id);if(a)launch(a,downApp.querySelector('.ic'))}
    else if(downAct){const k=downAct.dataset.act;if(k==='today')flyTo(1);else if(k==='loc')locate();else if(k==='wretry')loadWeather(true)}
    else if(overview&&downPanel)flyTo(+downPanel.dataset.i);
    else if(!downPanel)burst(e.clientX,e.clientY);
  }else if(axis==='h'){
    if(overview){angleT=Math.round((angle+lastDx*4)/step)*step}
    else{const base=Math.round(startAngle/step),delta=(angle-startAngle)/step;let d=Math.round(delta);
      if(d===0&&(Math.abs(delta)>.12||Math.abs(lastDx)>5))d=Math.sign(Math.abs(lastDx)>5?lastDx:delta);
      angleT=(base+d)*step}
  }else if(axis==='v'){
    if(ty<-60&&!overview)setOverview(true);
    else if(ty>60&&overview){angleT=Math.round(angle/step)*step;setOverview(false)}
  }
  downApp=null;downPanel=null;downAct=null;
}
stage.addEventListener('pointerup',endPointer);
stage.addEventListener('pointercancel',endPointer);
stage.addEventListener('wheel',e=>{e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(Math.abs(d)>8){angleT=nearestAngle(mod(Math.round(angle/step)+(d>0?1:-1),N))}},{passive:false});

const fx=$('#fx');
function launch(a,icEl){
  const r=icEl.getBoundingClientRect(),sz=Math.min(r.width,60);
  fx.textContent=a.e;fx.style.background='linear-gradient(145deg,'+a.c[0]+','+a.c[1]+')';fx.classList.remove('go');
  Object.assign(fx.style,{display:'grid',left:r.left+'px',top:r.top+'px',width:sz+'px',height:sz+'px'});
  void fx.offsetWidth;fx.classList.add('go');
  setTimeout(()=>{try{if(/^https?:/i.test(a.u))window.open(a.u,'_blank');else window.location.href=a.u}catch(e){toast('تعذّر فتح '+a.n)}},380);
  setTimeout(()=>{fx.classList.remove('go');fx.style.display='none'},1300);
}
let tt;function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------- picker (long press) ---------- */
const picker=$('#picker');
function openPicker(a){
  $('#pTitle').textContent='«'+a.n+'»';
  const L=$('#pList');L.innerHTML='';
  const fb=document.createElement('button');const fon=favs.includes(a.id);
  fb.className=fon?'on':'';fb.innerHTML='<span>⭐</span>المفضلة'+(fon?' ✓':'');
  fb.onclick=()=>{favs=favs.includes(a.id)?favs.filter(x=>x!==a.id):favs.concat(a.id);save();renderHome();openPicker(a)};
  L.appendChild(fb);
  folders.forEach(f=>{
    const b=document.createElement('button');const on=f.apps.includes(a.id);
    b.className=on?'on':'';b.innerHTML='<span>'+esc(f.e)+'</span>'+esc(f.n)+(on?' ✓':'');
    b.onclick=()=>{f.apps=f.apps.includes(a.id)?f.apps.filter(x=>x!==a.id):f.apps.concat(a.id);save();rebuild();openPicker(a)};
    L.appendChild(b);
  });
  picker.hidden=false;
}

/* ---------- edit sheet ---------- */
const sheet=$('#sheet');let selF=0;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let R=n>>16,G=(n>>8)&255,B=n&255;
  R=clamp(Math.round(R*(1+amt)),0,255);G=clamp(Math.round(G*(1+amt)),0,255);B=clamp(Math.round(B*(1+amt)),0,255);
  return'#'+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1)}
function renderSheet(){
  const T=$('#fTabs');T.innerHTML='';
  folders.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f.e;b.setAttribute('aria-label',f.n);
    b.setAttribute('aria-pressed',i===selF);b.onclick=()=>{selF=i;renderSheet()};T.appendChild(b)});
  const f=folders[selF];$('#fdName').value=f.n;$('#fdEmoji').value=f.e;
  const L=$('#list');L.innerHTML='';
  apps.forEach((a,i)=>{
    const on=f.apps.includes(a.id);const d=document.createElement('div');d.className='item';
    d.innerHTML=icHTML(a)+'<span class="n">'+esc(a.n)+'</span><button data-act="in" class="'+(on?'on':'')+'" aria-label="في المجلد">'+(on?'✓':'+')+'</button><button data-act="del" aria-label="حذف">🗑️</button>';
    d.querySelector('[data-act=in]').onclick=()=>{f.apps=f.apps.includes(a.id)?f.apps.filter(x=>x!==a.id):f.apps.concat(a.id);save();rebuild();renderSheet()};
    d.querySelector('[data-act=del]').onclick=()=>{apps.splice(i,1);folders.forEach(F=>F.apps=F.apps.filter(x=>x!==a.id));favs=favs.filter(x=>x!==a.id);save();rebuild();renderSheet()};
    L.appendChild(d);
  });
}
$('#fdName').addEventListener('change',e=>{const v=e.target.value.trim();if(v){folders[selF].n=v;save();rebuild()}});
$('#fdEmoji').addEventListener('change',e=>{const v=e.target.value.trim();if(v){folders[selF].e=v;save();rebuild();renderSheet()}});
$('#editBtn').onclick=()=>{selF=clamp(cur-2,0,folders.length-1);renderSheet();sheet.hidden=false};
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{if(e.target===s||e.target.closest('[data-close]'))s.hidden=true}));
$('#addBtn').onclick=()=>{
  const n=$('#fName').value.trim(),u=$('#fUrl').value.trim(),e=$('#fEmoji').value.trim()||'✨',c=$('#fColor').value;
  if(!n||!u){toast('اكتب اسم التطبيق ورابطه');return}
  const id='u'+Date.now();apps.push({id,n,e,u,c:[shade(c,.25),shade(c,-.35)]});folders[selF].apps.push(id);
  save();rebuild();renderSheet();$('#fName').value='';$('#fUrl').value='';$('#fEmoji').value='';
  toast('أُضيف '+n+' إلى '+folders[selF].n);
};
$('#resetBtn').onclick=()=>{apps=clone(DEFAULT_APPS);folders=clone(DEFAULT_FOLDERS);favs=DEFAULT_FAVS.slice();save();rebuild();renderSheet();toast('استُعيدت الإعدادات الافتراضية')};

/* ---------- gyroscope ---------- */
const gyro={x:0,y:0,tx:0,ty:0};let gyroOn=false,gyroBase=null,gyroSeen=false;
function onOri(e){if(!gyroOn||e.beta==null)return;gyroSeen=true;if(!gyroBase)gyroBase={b:e.beta,g:e.gamma};
  gyro.tx=clamp((e.gamma-gyroBase.g)/30,-1,1);gyro.ty=clamp((e.beta-gyroBase.b)/30,-1,1)}
$('#gyroBtn').addEventListener('click',async()=>{
  const btn=$('#gyroBtn');
  if(gyroOn){gyroOn=false;gyro.tx=gyro.ty=0;btn.setAttribute('aria-pressed','false');toast('أُوقف التحكم بالإمالة');return}
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){toast('لم يُسمح بالوصول لمستشعر الحركة');return}}
    window.addEventListener('deviceorientation',onOri);gyroOn=true;gyroBase=null;gyroSeen=false;
    btn.setAttribute('aria-pressed','true');toast('أمِل هاتفك لترى الشاشات بزاوية ثلاثية الأبعاد');
    setTimeout(()=>{if(gyroOn&&!gyroSeen){toast('المستشعر غير متاح هنا — افتح الصفحة في سفاري');gyroOn=false;btn.setAttribute('aria-pressed','false')}},1800);
  }catch(err){toast('المستشعر غير متاح في هذا المتصفح')}
});

/* ---------- sky ---------- */
const cv=$('#sky'),cx=cv.getContext('2d');let SW=0,SH=0,stars=[],parts=[],shoot=null,starRGB='255,244,225',saffron='#ffb547';
function readTheme(){const cs=getComputedStyle(document.documentElement);starRGB=cs.getPropertyValue('--star').trim()||starRGB;saffron=cs.getPropertyValue('--saffron').trim()||saffron}
function sizeSky(){const dpr=Math.min(2,window.devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=SW*dpr;cv.height=SH*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  stars=Array.from({length:Math.round(SW*SH/2200)},()=>({x:Math.random()*SW,y:Math.random()*SH,d:Math.random()*.9+.1,r:Math.random()*1.3+.25,p:Math.random()*6.28}));readTheme()}
function burst(x,y){for(let i=0;i<26;i++){const a=Math.random()*6.28,s=Math.random()*4+1.2;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:Math.random()*2+1})}}
function drawSky(t,Y,Z){
  cx.clearRect(0,0,SW,SH);
  for(const s of stars){const x=((s.x+Y*2.2*s.d)%SW+SW)%SW,y=((s.y-Z*40*s.d)%SH+SH)%SH;
    const a=(.35+.65*(.5+.5*Math.sin(t*.0018*s.d+s.p)))*s.d;
    cx.fillStyle='rgba('+starRGB+','+a.toFixed(3)+')';cx.beginPath();cx.arc(x,y,s.r,0,6.283);cx.fill()}
  if(!shoot&&Math.random()<.003)shoot={x:SW*(.3+Math.random()*.7),y:Math.random()*SH*.35,vx:-(7+Math.random()*4),vy:3+Math.random()*2,life:1};
  if(shoot){const g=cx.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*10,shoot.y-shoot.vy*10);
    g.addColorStop(0,'rgba('+starRGB+','+shoot.life+')');g.addColorStop(1,'rgba('+starRGB+',0)');
    cx.strokeStyle=g;cx.lineWidth=1.8;cx.beginPath();cx.moveTo(shoot.x,shoot.y);cx.lineTo(shoot.x-shoot.vx*10,shoot.y-shoot.vy*10);cx.stroke();
    shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.life-=.018;if(shoot.life<=0)shoot=null}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=.022;
    if(p.life<=0){parts.splice(i,1);continue}cx.globalAlpha=p.life;cx.fillStyle=saffron;cx.beginPath();cx.arc(p.x,p.y,p.r*p.life+.3,0,6.283);cx.fill();cx.globalAlpha=1}
}

/* ---------- loop ---------- */
function frame(t){
  if(!dragging)angle+=(angleT-angle)*(reduce?.35:.11);
  const far=Math.abs(angleT-angle);
  const zt=overview?1:dragging&&axis==='h'?.32:far>1.5?Math.min(.6,.14+far/160):0;
  zoom+=(zt-zoom)*(reduce?.4:.1);
  if(overview&&!dragging&&!reduce&&Math.abs(angleT-angle)<.5){angleT+=.06}
  gyro.x+=(gyro.tx-gyro.x)*.12;gyro.y+=(gyro.ty-gyro.y)*.12;
  const gx=gyro.x*10,gy=gyro.y*7;
  ring.style.transform='translateZ('+(-r-zoom*push).toFixed(1)+'px) translateY('+(-zoom*Hs*.04).toFixed(1)+'px) rotateX('+(-zoom*9-gy).toFixed(2)+'deg) rotateY('+(angle+gx).toFixed(2)+'deg)';
  floor.style.opacity=Math.min(1,zoom*1.4).toFixed(3);
  setCur(mod(Math.round(angle/step),N));
  drawSky(t,angle,zoom);
  requestAnimationFrame(frame);
}

function rebuild(){const keep=cur;geom();buildPanels();buildDots();buildDock();cur=-1;setCur(Math.max(0,keep))}
window.addEventListener('resize',()=>{geom();placePanels();sizeSky()});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme)}catch(e){}
sizeSky();geom();buildPanels();buildDots();buildDock();loadWeather(false);
zoom=1;angle=-360;angleT=0;
requestAnimationFrame(frame);
if(!store.get('madar3-seen',false)){setTimeout(()=>toast('اسحب يميناً ويساراً للتنقل • اسحب لأعلى لرؤية كل الشاشات • اضغط مطوّلاً على تطبيق'),1200);store.set('madar3-seen',true)}
})();
</script>
